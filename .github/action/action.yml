name: 'skipbuild Build Cache'
description: 'Cache C++ object files across builds for faster compilation'
author: 'rayyan0x'

inputs:
  cache-key:
    description: 'Cache key prefix (include OS, compiler, etc.)'
    required: false
    default: '${{ runner.os }}-${{ hashFiles(''**/CMakeLists.txt'') }}-${{ hashFiles(''**/*.cpp'', ''**/*.hpp'', ''**/*.h'') }}'
  cache-dir:
    description: 'Cache directory (passed as SKIPBUILD_CACHE_DIR)'
    required: false
    default: '~/.cache/skipbuild'

runs:
  using: 'composite'
  steps:
    - name: Install skipbuild
      shell: bash
      run: |
        set -euo pipefail
        scripts_dir="$(cd "${GITHUB_ACTION_PATH}/../../scripts" && pwd)"
        if [ "${{ runner.os }}" = "Windows" ]; then
          pwsh -NoProfile -File "$scripts_dir/install.ps1"
          echo "${LOCALAPPDATA}\\skipbuild\\bin" >> "$GITHUB_PATH"
        else
          bash "$scripts_dir/install.sh"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        fi

    - name: Configure cache directory
      shell: bash
      run: |
        echo "SKIPBUILD_CACHE_DIR=${{ inputs.cache-dir }}" >> "$GITHUB_ENV"

    - name: Enable compiler launcher
      shell: bash
      run: |
        echo "CMAKE_C_COMPILER_LAUNCHER=skipbuild" >> "$GITHUB_ENV"
        echo "CMAKE_CXX_COMPILER_LAUNCHER=skipbuild" >> "$GITHUB_ENV"

    - name: Restore cache
      uses: actions/cache@v4
      with:
        path: ${{ inputs.cache-dir }}
        key: skipbuild-${{ inputs.cache-key }}
        restore-keys: |
          skipbuild-${{ runner.os }}-

    - name: Save cache
      if: always()
      uses: actions/cache@v4
      with:
        path: ${{ inputs.cache-dir }}
        key: skipbuild-${{ inputs.cache-key }}
