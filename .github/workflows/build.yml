name: Build and Test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # x64 platforms
          - os: windows-latest
          - os: ubuntu-latest
          - os: macos-latest
          # ARM64 platforms
          - os: ubuntu-24.04-arm
            name: "Ubuntu ARM64"
          - os: macos-14
            name: "macOS ARM64 (Apple Silicon)"
          - os: windows-11-arm
            name: "Windows ARM64"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --timeout 120

      - name: Upload binary (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: skipbuild-${{ matrix.name || runner.os }}-${{ runner.arch }}
          path: build/Release/skipbuild.exe

      - name: Upload binary (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: skipbuild-${{ matrix.name || runner.os }}-${{ runner.arch }}
          path: build/skipbuild

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      # Each build job uploads a binary literally named "skipbuild"/"skipbuild.exe",
      # so uploading dist/**/* would collide and leave only two assets. Rename to
      # canonical per-platform names and emit SHA256SUMS for the install scripts.
      - name: Normalize release assets
        run: |
          set -euo pipefail
          mkdir -p out
          for d in dist/*/; do
            name="$(basename "$d")"
            bin=""
            for f in "$d"*; do
              [ -f "$f" ] && bin="$f" && break
            done
            [ -n "$bin" ] || continue
            case "$name" in
              *Windows*ARM64*)              out="skipbuild-windows-arm64.exe" ;;
              *Windows*)                    out="skipbuild-windows-x64.exe" ;;
              *ARM64*) case "$name" in
                         *[Mm]ac*|*Darwin*) out="skipbuild-macos-arm64" ;;
                         *)                 out="skipbuild-linux-arm64" ;;
                       esac ;;
              *)       case "$name" in
                         *[Mm]ac*|*Darwin*) out="skipbuild-macos-x64" ;;
                         *)                 out="skipbuild-linux-x64" ;;
                       esac ;;
            esac
            cp "$bin" "out/$out"
            printf '%s -> %s\n' "$name" "$out"
          done
          cd out
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true