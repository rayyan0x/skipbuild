name: Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            runs-on: windows-latest
            artifact: skipbuild.exe
            asset: skipbuild-windows-x64.exe
            shell: pwsh
          - os: ubuntu-latest
            runs-on: ubuntu-latest
            artifact: skipbuild
            asset: skipbuild-linux-x64
            shell: bash
          - os: macos-latest
            runs-on: macos-latest
            artifact: skipbuild
            asset: skipbuild-macos-x64
            shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Install dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install cmake ninja

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -G Ninja
        shell: ${{ matrix.shell }}

      - name: Build
        run: cmake --build build --config Release --parallel
        shell: ${{ matrix.shell }}

      - name: Verify binary exists
        run: |
          ls -la build/
          test -f build/${{ matrix.artifact }}
        shell: ${{ matrix.shell }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: build/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: always() && needs.build.result == 'success'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: List downloaded artifacts
        run: ls -la dist/

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/skipbuild-windows-x64.exe
            dist/skipbuild-linux-x64
            dist/skipbuild-macos-x64
            dist/SHA256SUMS
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}